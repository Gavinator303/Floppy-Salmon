<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google-style Salmon Runner</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, Arial, sans-serif;
        background: #f6f6f6;
        color: #222;
      }
      .game-shell {
        width: min(94vw, 760px);
        padding: 16px;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 16px 40px rgba(0,0,0,0.16);
      }
      .hud {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        font-size: 0.95rem;
        font-weight: 600;
      }
      canvas {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 12px;
        background: #f8f8f8;
      }
      .hint {
        margin-top: 10px;
        text-align: center;
        font-size: 0.92rem;
        color: #555;
      }
      .hint kbd {
        background: #f0f0f0;
        border: 1px solid #ccc;
        border-bottom-width: 2px;
        padding: 2px 6px;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div class="game-shell">
      <div class="hud">
        <div>Score: <span id="score">0</span></div>
        <div>Level: <span id="level">1</span></div>
        <div>Best: <span id="best">0</span></div>
      </div>
      <canvas id="game" width="760" height="220"></canvas>
      <div class="hint">Press <kbd>Space</kbd> or <kbd>↑</kbd> to jump, and <kbd>Z</kbd> to shoot invasive carp. Tap the screen to play.</div>
    </div>

    <script>
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const levelEl = document.getElementById('level');

      const GRAVITY = 0.55;
      const JUMP_FORCE = -13.2;
      const GROUND_Y = 180;
      const SALMON_X = 110;
      const SALMON_WIDTH = 48;
      const SALMON_HEIGHT = 34;
      const DAM_SPEED = 5.2;
      const CARP_SPEED = 4.6;
      const BULLET_SPEED = 11;
      const SHOOT_COOLDOWN = 12;
      const LEVEL_TRANSITION_SCORE = 20;
      const NUCLEAR_SCORE = 50;
      const CUTSCENE_DURATION = 600;
      const NUKE_DURATION = 90;

      let state = 'ready';
      let score = 0;
      let best = Number(localStorage.getItem('salmon-runner-best') || 0);
      let salmon;
      let dams;
      let carps;
      let bullets;
      let clouds;
      let spawnTimer = 0;
      let frame = 0;
      let shootCooldown = 0;
      let currentLevel = 1;
      let cutsceneFrame = 0;
      let nuke = null;
      let nukeTriggered = false;

      function resetGame() {
        salmon = {
          x: SALMON_X,
          y: GROUND_Y - SALMON_HEIGHT,
          width: SALMON_WIDTH,
          height: SALMON_HEIGHT,
          velocity: 0,
          onGround: true,
        };
        dams = [];
        carps = [];
        bullets = [];
        clouds = Array.from({ length: 5 }, (_, i) => ({
          x: 120 + i * 120,
          y: 30 + (i % 3) * 28,
          size: 20 + (i % 2) * 12,
          speed: 0.4 + (i % 3) * 0.2,
        }));
        score = 0;
        frame = 0;
        spawnTimer = 60;
        shootCooldown = 0;
        currentLevel = 1;
        cutsceneFrame = 0;
        nuke = null;
        nukeTriggered = false;
        state = 'ready';
        updateHud();
      }

      function updateHud() {
        scoreEl.textContent = score;
        bestEl.textContent = best;
        levelEl.textContent = currentLevel;
      }

      function startGame() {
        if (state === 'over') {
          resetGame();
        }
        state = 'playing';
      }

      function jump() {
        if (state === 'ready') {
          startGame();
        }
        if (state === 'playing' && salmon.onGround) {
          salmon.velocity = JUMP_FORCE;
          salmon.onGround = false;
        }
      }

      function shoot() {
        if (state === 'ready') {
          startGame();
        }
        if (state !== 'playing' || shootCooldown > 0) {
          return;
        }

        bullets.push({
          x: salmon.x + salmon.width + 4,
          y: salmon.y + salmon.height / 2 - 2,
          radius: 6,
        });
        shootCooldown = SHOOT_COOLDOWN;
      }

      function spawnDam() {
        const width = currentLevel === 1 ? 22 + Math.random() * 26 : 28 + Math.random() * 32;
        const height = currentLevel === 1 ? 26 + Math.random() * 42 : 34 + Math.random() * 44;
        dams.push({ x: canvas.width + 20, width, height, passed: false });
      }

      function spawnCarp() {
        carps.push({
          x: canvas.width + 20,
          y: GROUND_Y - 18,
          width: 24,
          height: 14,
          passed: false,
        });
      }

      function startLevelTransition() {
        if (state !== 'playing' || currentLevel !== 1) return;
        state = 'cutscene';
        cutsceneFrame = 0;
        salmon.x = SALMON_X;
        salmon.y = GROUND_Y - SALMON_HEIGHT;
        salmon.velocity = 0;
        salmon.onGround = true;
        dams = [];
        carps = [];
        bullets = [];
        spawnTimer = 999;
      }

      function enterLevel2() {
        currentLevel = 2;
        state = 'playing';
        cutsceneFrame = 0;
        salmon.x = SALMON_X;
        salmon.y = GROUND_Y - SALMON_HEIGHT;
        salmon.velocity = 0;
        salmon.onGround = true;
        dams = [];
        carps = [];
        bullets = [];
        spawnTimer = 34;
        updateHud();
      }

      function triggerNuke() {
        if (state !== 'playing' || nukeTriggered) return;
        nukeTriggered = true;
        state = 'nuke';
        nuke = { x: canvas.width * 0.78, y: -40, progress: 0 };
        dams = [];
        carps = [];
        bullets = [];
        spawnTimer = 999;
      }

      function update() {
        frame += 1;

        if (state === 'cutscene') {
          cutsceneFrame += 1;
          const t = Math.min(1, cutsceneFrame / CUTSCENE_DURATION);
          const swimX = SALMON_X + t * 320;
          let swimY = GROUND_Y - SALMON_HEIGHT;

          if (t < 0.48) {
            swimY = GROUND_Y - SALMON_HEIGHT - Math.sin(t * Math.PI * 1.2) * 18;
          } else if (t < 0.78) {
            const climbT = (t - 0.48) / 0.30;
            swimY = GROUND_Y - SALMON_HEIGHT - 18 - climbT * 70;
          } else {
            const leapT = (t - 0.78) / 0.22;
            swimY = GROUND_Y - SALMON_HEIGHT - 88 - Math.sin(leapT * Math.PI) * 54;
          }

          salmon.x = swimX;
          salmon.y = swimY;

          if (cutsceneFrame >= CUTSCENE_DURATION) {
            enterLevel2();
          }
          return;
        }

        if (state === 'nuke') {
          if (!nuke) {
            endGame();
            return;
          }

          nuke.progress += 1;
          nuke.x -= 1.4;
          nuke.y += 5.2 + Math.min(3.4, nuke.progress * 0.04);

          if (nuke.progress >= NUKE_DURATION) {
            endGame();
          }
          return;
        }

        if (state === 'playing') {
          if (currentLevel === 1 && score >= LEVEL_TRANSITION_SCORE) {
            startLevelTransition();
            return;
          }
          if (score >= NUCLEAR_SCORE && !nukeTriggered) {
            triggerNuke();
            return;
          }
          if (shootCooldown > 0) {
            shootCooldown -= 1;
          }

          clouds.forEach((cloud) => {
            cloud.x -= cloud.speed;
            if (cloud.x < -60) {
              cloud.x = canvas.width + 50;
            }
          });

          salmon.velocity += GRAVITY;
          salmon.y += salmon.velocity;

          if (salmon.y >= GROUND_Y - SALMON_HEIGHT) {
            salmon.y = GROUND_Y - SALMON_HEIGHT;
            salmon.velocity = 0;
            salmon.onGround = true;
          }

          for (let b = bullets.length - 1; b >= 0; b -= 1) {
            const bullet = bullets[b];
            bullet.x += BULLET_SPEED;

            if (bullet.x > canvas.width + 20) {
              bullets.splice(b, 1);
              continue;
            }

            let hitIndex = -1;
            for (let i = carps.length - 1; i >= 0; i -= 1) {
              const carp = carps[i];
              const hit =
                bullet.x + bullet.radius > carp.x &&
                bullet.x - bullet.radius < carp.x + carp.width &&
                bullet.y + bullet.radius > carp.y &&
                bullet.y - bullet.radius < carp.y + carp.height;

              if (hit) {
                hitIndex = i;
                break;
              }
            }

            if (hitIndex !== -1) {
              carps.splice(hitIndex, 1);
              bullets.splice(b, 1);
              score += 3;
              best = Math.max(best, score);
              localStorage.setItem('salmon-runner-best', String(best));
              updateHud();
            }
          }

          for (let i = dams.length - 1; i >= 0; i -= 1) {
            const dam = dams[i];
            dam.x -= DAM_SPEED + Math.min(1.2, score / 100) * 0.7;

            if (!dam.passed && dam.x + dam.width < salmon.x) {
              dam.passed = true;
              score += 1;
              best = Math.max(best, score);
              localStorage.setItem('salmon-runner-best', String(best));
              updateHud();
            }

            const collision =
              salmon.x + salmon.width > dam.x &&
              salmon.x < dam.x + dam.width &&
              salmon.y + salmon.height > GROUND_Y - dam.height &&
              salmon.y < GROUND_Y - dam.height + dam.height;

            if (collision) {
              endGame();
              break;
            }

            if (dam.x + dam.width < -10) {
              dams.splice(i, 1);
            }
          }

          for (let i = carps.length - 1; i >= 0; i -= 1) {
            const carp = carps[i];
            carp.x -= CARP_SPEED + Math.min(1.2, score / 90) * 0.4;

            const collision =
              salmon.x + salmon.width > carp.x &&
              salmon.x < carp.x + carp.width &&
              salmon.y + salmon.height > carp.y &&
              salmon.y < carp.y + carp.height;

            if (collision) {
              endGame();
              break;
            }

            if (carp.x + carp.width < -12) {
              carps.splice(i, 1);
            }
          }

          spawnTimer -= 1;
          if (spawnTimer <= 0) {
            spawnDam();
            if (Math.random() > (currentLevel === 1 ? 0.62 : 0.38)) {
              spawnCarp();
            }
            const pace = currentLevel === 1
              ? Math.max(36, 90 - Math.floor(score / 3))
              : Math.max(24, 70 - Math.floor(score / 4));
            spawnTimer = pace + Math.floor(Math.random() * (currentLevel === 1 ? 24 : 16));
          }
        }
      }

      function endGame() {
        if (state === 'over') return;
        state = 'over';
        best = Math.max(best, score);
        localStorage.setItem('salmon-runner-best', String(best));
        updateHud();
      }

      function drawBackground() {
        const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
        if (state === 'nuke') {
          sky.addColorStop(0, '#2d1714');
          sky.addColorStop(1, '#6d1d13');
        } else {
          sky.addColorStop(0, currentLevel === 2 ? '#dff4ff' : '#f8fbff');
          sky.addColorStop(1, currentLevel === 2 ? '#a7d8ff' : '#dceeff');
        }
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ffd166';
        ctx.beginPath();
        ctx.arc(650, 50, 24, 0, Math.PI * 2);
        ctx.fill();

        clouds.forEach((cloud) => {
          ctx.fillStyle = 'rgba(255,255,255,0.9)';
          ctx.beginPath();
          ctx.arc(cloud.x, cloud.y, cloud.size, 0, Math.PI * 2);
          ctx.arc(cloud.x + 14, cloud.y - 8, cloud.size - 6, 0, Math.PI * 2);
          ctx.arc(cloud.x + 28, cloud.y, cloud.size - 2, 0, Math.PI * 2);
          ctx.fill();
        });

        ctx.fillStyle = currentLevel === 2 ? '#6fb0d8' : '#8ec5ff';
        ctx.fillRect(0, 180, canvas.width, 40);

        ctx.fillStyle = currentLevel === 2 ? '#2b6f87' : '#4a7f9d';
        ctx.fillRect(0, 190, canvas.width, 30);

        for (let i = 0; i < 26; i += 1) {
          const x = (canvas.width + 80) - ((i * 58 + frame * 1.6) % (canvas.width + 80)) - 40;
          const y = 188 + ((i + frame) % 3) * 2;
          ctx.fillStyle = 'rgba(255,255,255,0.65)';
          ctx.fillRect(x, y, 18, 2);
        }

        for (let i = 0; i < 12; i += 1) {
          const x = (canvas.width + 90) - ((i * 76 + frame * 0.6) % (canvas.width + 90)) - 45;
          const y = 176 + (i % 3) * 4;
          ctx.fillStyle = '#6d4c41';
          ctx.fillRect(x, y, 5, 10);
        }

        for (let i = 0; i < 8; i += 1) {
          const x = (canvas.width + 110) - ((i * 95 + frame * 0.35) % (canvas.width + 110)) - 55;
          const y = 182 + (i % 2) * 4;
          ctx.beginPath();
          ctx.fillStyle = '#6b6b6b';
          ctx.moveTo(x, y + 10);
          ctx.lineTo(x + 8, y);
          ctx.lineTo(x + 16, y + 10);
          ctx.lineTo(x + 12, y + 20);
          ctx.lineTo(x + 4, y + 20);
          ctx.closePath();
          ctx.fill();
        }

        if (state === 'cutscene') {
          const waterPhase = (frame * 0.08) % 20;
          ctx.fillStyle = '#152d3d';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.fillStyle = '#2d5c7a';
          ctx.beginPath();
          ctx.moveTo(440, 180);
          ctx.lineTo(520, 80);
          ctx.lineTo(560, 80);
          ctx.lineTo(640, 180);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#6b8ea3';
          ctx.beginPath();
          ctx.moveTo(445, 180);
          ctx.lineTo(520, 92);
          ctx.lineTo(558, 92);
          ctx.lineTo(632, 180);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#6fd3ff';
          for (let i = 0; i < 12; i += 1) {
            const x = 450 + i * 14;
            const y = 128 + ((i + waterPhase) % 5) * 6;
            ctx.fillRect(x, y, 10, 6);
          }

          ctx.fillStyle = '#bfeaff';
          for (let i = 0; i < 16; i += 1) {
            const x = 446 + i * 12;
            const y = 144 + ((i * 3 + waterPhase) % 4) * 3;
            ctx.fillRect(x, y, 8, 3);
          }

          ctx.fillStyle = '#2e7aa5';
          ctx.beginPath();
          ctx.moveTo(460, 110);
          ctx.lineTo(505, 80);
          ctx.lineTo(540, 88);
          ctx.lineTo(530, 116);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#5bb6e6';
          ctx.beginPath();
          ctx.moveTo(470, 120);
          ctx.lineTo(510, 92);
          ctx.lineTo(534, 98);
          ctx.lineTo(520, 126);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#e4f7ff';
          ctx.beginPath();
          ctx.moveTo(460, 180);
          ctx.quadraticCurveTo(500, 150, 540, 180);
          ctx.quadraticCurveTo(520, 168, 500, 180);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#8ec9e6';
          ctx.fillRect(432, 180, 220, 6);

          ctx.fillStyle = 'rgba(255,255,255,0.85)';
          ctx.font = '700 24px Inter, Arial';
          ctx.textAlign = 'center';
          ctx.fillText('Upstream', 380, 60);
        }
      }

      function drawNuke() {
        if (!nuke || state !== 'nuke') return;

        const progress = Math.min(1, nuke.progress / NUKE_DURATION);
        const glow = 20 + progress * 80;
        const x = nuke.x;
        const y = nuke.y;

        if (nuke.progress < 40) {
          ctx.save();
          ctx.translate(x, y);
          ctx.fillStyle = '#7d8288';
          ctx.fillRect(-8, -10, 16, 24);
          ctx.fillStyle = '#4d4f54';
          ctx.fillRect(-6, -8, 12, 10);
          ctx.fillStyle = '#f5c66b';
          ctx.fillRect(-3, -2, 6, 4);
          ctx.fillStyle = '#ff6b57';
          ctx.fillRect(-2, 8, 4, 6);
          ctx.restore();
          return;
        }

        ctx.save();
        ctx.globalAlpha = Math.min(1, (nuke.progress - 40) / 20);
        ctx.fillStyle = `rgba(255, 170, 80, ${0.35 + progress * 0.35})`;
        ctx.beginPath();
        ctx.arc(x, y, glow, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.beginPath();
        ctx.arc(x, y, glow * 0.45, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawBullets() {
        bullets.forEach((bullet) => {
          ctx.fillStyle = '#ff4d4f';
          ctx.beginPath();
          ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      function drawDams() {
        dams.forEach((dam) => {
          ctx.save();
          ctx.translate(dam.x, GROUND_Y - dam.height);

          ctx.fillStyle = '#7a6f5f';
          ctx.fillRect(0, 0, dam.width, dam.height);

          ctx.fillStyle = '#a69b8e';
          ctx.fillRect(0, 8, dam.width, 8);
          ctx.fillRect(0, dam.height - 8, dam.width, 8);

          ctx.fillStyle = '#5b4d42';
          ctx.fillRect(0, 0, dam.width, 4);
          ctx.fillRect(0, dam.height - 4, dam.width, 4);

          ctx.restore();
        });
      }

      function drawCarps() {
        carps.forEach((carp) => {
          const flap = Math.sin((frame + carp.x) / 7) * 4;
          ctx.save();
          ctx.translate(carp.x, carp.y);

          ctx.fillStyle = '#ff6b4a';
          ctx.fillRect(0, 2, 8, 8);
          ctx.fillRect(8, 0, 10, 12);
          ctx.fillRect(18, 2, 8, 8);
          ctx.fillRect(26, 4, 4, 4);

          ctx.fillStyle = '#ff8f6b';
          ctx.fillRect(8, 2, 2, 2);
          ctx.fillRect(18, 2, 2, 2);

          ctx.fillStyle = '#d85b2d';
          ctx.fillRect(0, 2, 2, 2);
          ctx.fillRect(8, 0, 2, 2);
          ctx.fillRect(16, 2, 2, 2);

          ctx.fillStyle = '#1d3557';
          ctx.fillRect(22, 4, 2, 2);

          ctx.fillStyle = '#8b2c2c';
          ctx.beginPath();
          ctx.moveTo(0, 6);
          ctx.lineTo(-6 + flap * 0.6, 4 + flap * 0.4);
          ctx.lineTo(-6 + flap * 0.6, 8 + flap * 0.4);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#ff3b30';
          ctx.beginPath();
          ctx.moveTo(-4 + flap * 0.4, 6);
          ctx.lineTo(-10 + flap * 0.4, 2 + flap * 0.4);
          ctx.lineTo(-10 + flap * 0.4, 10 + flap * 0.4);
          ctx.closePath();
          ctx.fill();

          ctx.restore();
        });
      }

      function drawSalmon() {
        const bob = state === 'playing' ? Math.sin(frame / 8) * 1.3 : 0;
        const tailFlap = state === 'playing' ? Math.sin(frame / 5) * 6 : 0;
        ctx.save();
        ctx.translate(salmon.x, salmon.y + bob);

        ctx.fillStyle = '#ff5a3c';
        ctx.fillRect(0, 4, 16, 14);
        ctx.fillRect(16, 0, 18, 22);
        ctx.fillRect(34, 4, 12, 14);

        ctx.fillStyle = '#ff7b57';
        ctx.fillRect(3, 8, 3, 3);
        ctx.fillRect(18, 4, 3, 3);
        ctx.fillRect(32, 8, 3, 3);

        ctx.fillStyle = '#d8452b';
        ctx.fillRect(0, 4, 3, 3);
        ctx.fillRect(16, 0, 3, 3);
        ctx.fillRect(34, 4, 3, 3);

        ctx.fillStyle = '#1d3557';
        ctx.fillRect(36, 8, 3, 3);

        ctx.fillStyle = '#fff';
        ctx.fillRect(38, 8, 1, 1);

        ctx.fillStyle = '#8b2c2c';
        ctx.beginPath();
        ctx.moveTo(0, 11);
        ctx.lineTo(-12 + tailFlap * 0.6, 4 + tailFlap * 0.3);
        ctx.lineTo(-12 + tailFlap * 0.6, 18 + tailFlap * 0.3);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ff3b30';
        ctx.beginPath();
        ctx.moveTo(-6 + tailFlap * 0.4, 11);
        ctx.lineTo(-18 + tailFlap * 0.4, 4 + tailFlap * 0.3);
        ctx.lineTo(-18 + tailFlap * 0.4, 18 + tailFlap * 0.3);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }

      function drawOverlay() {
        if (state === 'ready') {
          ctx.fillStyle = 'rgba(255,255,255,0.55)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#222';
          ctx.font = '700 28px Inter, Arial';
          ctx.textAlign = 'center';
          ctx.fillText('Salmon Runner', 380, 95);
          ctx.font = '600 16px Inter, Arial';
          ctx.fillText('Press space to start', 380, 125);
        }

        if (state === 'cutscene') {
          ctx.fillStyle = 'rgba(255,255,255,0.24)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#1f3d5c';
          ctx.font = '700 24px Inter, Arial';
          ctx.textAlign = 'center';
          ctx.fillText('Level 2', 380, 70);
          ctx.font = '600 16px Inter, Arial';
          ctx.fillText('The salmon climbs toward the waterfall...', 380, 98);
        }

        if (state === 'nuke') {
          ctx.fillStyle = 'rgba(20, 8, 8, 0.34)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#fff4e0';
          ctx.font = '700 26px Inter, Arial';
          ctx.textAlign = 'center';
          ctx.fillText('Nuclear Blast', 380, 95);
          ctx.font = '600 16px Inter, Arial';
          ctx.fillText('The river is wiped out...', 380, 124);
        }

        if (state === 'over') {
          ctx.fillStyle = 'rgba(255,255,255,0.62)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#222';
          ctx.font = '700 28px Inter, Arial';
          ctx.textAlign = 'center';
          ctx.fillText('Game Over', 380, 95);
          ctx.font = '600 16px Inter, Arial';
          ctx.fillText(`Score: ${score}`, 380, 124);
          ctx.fillText(`Best: ${best}`, 380, 146);
          ctx.fillText('Press space to retry', 380, 170);
        }
      }

      function draw() {
        drawBackground();
        drawNuke();
        drawBullets();
        drawDams();
        drawCarps();
        drawSalmon();
        drawOverlay();
      }

      function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
      }

      window.addEventListener('keydown', (event) => {
        if (event.code === 'Space' || event.code === 'ArrowUp') {
          event.preventDefault();
          if (state === 'over') {
            resetGame();
            startGame();
          } else {
            jump();
          }
        }

        if (event.code === 'KeyZ') {
          event.preventDefault();
          shoot();
        }
      });

      canvas.addEventListener('pointerdown', jump);
      canvas.addEventListener('touchstart', (event) => {
        event.preventDefault();
        jump();
      }, { passive: false });

      resetGame();
      updateHud();
      loop();
    </script>
  </body>
</html>
